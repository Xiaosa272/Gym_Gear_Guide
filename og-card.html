<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Gear Guide Cover</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: Arial, sans-serif; }
    .card { position: relative; width: 1200px; height: 630px; color: white; background: #0d2f25; }
    img { position: absolute; right: 0; top: 0; width: 610px; height: 630px; object-fit: cover; }
    .shade { position: absolute; right: 0; top: 0; width: 680px; height: 630px; background: linear-gradient(90deg, #0d2f25 0%, transparent 70%); }
    .copy { position: absolute; left: 90px; top: 105px; width: 650px; }
    .mark { width: 68px; height: 9px; margin-bottom: 38px; background: #f0ce65; }
    h1 { margin: 0 0 30px; font-size: 92px; line-height: 0.95; }
    p { margin: 0; color: #dceae4; font-size: 34px; line-height: 1.25; }
    strong { color: #f0ce65; }
  </style>
</head>
<body>
  <main class="card">
    <img src="images/gym-room.png" alt="">
    <div class="shade"></div>
    <div class="copy">
      <div class="mark"></div>
      <h1>Gym Gear<br>Guide</h1>
      <p><strong>Choose well.</strong> Train with a clear plan.</p>
    </div>
  </main>
</body>
</html>
